name: Weekly blog drafts

# Generates one markdown DRAFT per tool and opens a pull request with them.
#
# It does not publish. There is no WordPress call here, no XML-RPC, no REST post,
# and no auto-merge step — deliberately. Unreviewed generated content on a live
# domain is how a working SEO programme gets undone, and it cannot be undone back.
# The pull request is where a human writes the actual article.

on:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC / 09:30 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # the generator imports the .ts configs directly

      # The generator's own check. If it fails, no drafts and no pull request.
      - name: Check the generator
        run: node --test scripts/blog-draft.test.mjs

      - name: Generate drafts
        run: node scripts/blog-draft.mjs

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: blog-drafts/${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add content/drafts
          if git diff --cached --quiet; then
            echo 'No new drafts — every tool already has one. Nothing to open.'
            exit 0
          fi
          git commit -m 'chore(content): weekly blog draft skeletons'
          git push -u origin "$BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Skeletons only, generated by `scripts/blog-draft.mjs`. Nothing is published.

          Before merging, clear every `TODO(...)` marker and check that:

          - no statistic, cutoff or student result appears without a primary-source link
          - no exam date is stated as confirmed unless the exam body has published it
          - the post and the tool page are not chasing the same query
          - nothing reads as fear-selling

          Merging this as-is publishes nothing, but it does put unfinished skeletons in `main`.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Blog drafts for review — week of $(date -u '+%d %b %Y')" \
            --body-file "$RUNNER_TEMP/pr-body.md"
