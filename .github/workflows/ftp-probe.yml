name: FTP probe

# One-off diagnostic. Lists what the FTP account actually sees, so the deploy
# path can be set from fact instead of guesswork. Prints directory names only —
# never credentials, which stay in the runner.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP root and likely web roots
        env:
          H: ${{ secrets.HOSTINGER_HOST }}
          U: ${{ secrets.HOSTINGER_USER }}
          P: ${{ secrets.HOSTINGER_PASS }}
        run: |
          set +e
          for path in "/" "/public_html/" "/domains/" "/domains/learncrew.org/" \
                      "/domains/learncrew.org/public_html/" "/tools/" "/public_html/tools/"; do
            echo "=============================================="
            echo "LISTING: $path"
            curl -s --max-time 45 --ftp-ssl --insecure --list-only \
                 --user "$U:$P" "ftp://$H$path" > /tmp/ls.txt 2>/tmp/err.txt
            echo "  exit=$? lines=$(wc -l < /tmp/ls.txt)"
            sed 's/^/  ENTRY: /' /tmp/ls.txt | head -40
            [ -s /tmp/err.txt ] && sed 's/^/  ERR: /' /tmp/err.txt | head -3
          done
